model_id = "llama3.2-3b-rkllm"
n_layers = 28
hidden_size = 3072
num_key_value_heads = 8
supports_tensor = false
tasks = ["TextGeneration"]
backends = ["RkllmNpu"]
family = "llama"
quantization = "w8a8_g128"
base_model = "Llama 3.2 3B"
capabilities = ["text"]
context_length = 4096

# RKLLM runs on the Rockchip RK3588/RK3576 NPU. A pre-converted `.rkllm` file must be
# present on the NPU node under the models dir (directory name = this model_id); exo
# does not download it. Known-good artifact for runtime 1.2.x:
# huggingface.co/jamescallander/Llama-3.2-3B-Instruct_w8a8_g128_rk3588.rkllm
# (RKLLM-Toolkit v1.2.1, rknpu driver >= 0.9.8, 4.35 GB).
[storage_size]
in_bytes = 4351006028

[sampling_defaults]
temperature = 0.7
top_p = 0.9
