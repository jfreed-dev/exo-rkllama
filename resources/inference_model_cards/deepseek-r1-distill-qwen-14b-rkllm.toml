model_id = "deepseek-r1-distill-qwen-14b-rkllm"
n_layers = 48
hidden_size = 5120
num_key_value_heads = 8
supports_tensor = false
tasks = ["TextGeneration"]
backends = ["RkllmNpu"]
family = "qwen"
quantization = "w8a8_g128"
base_model = "DeepSeek-R1-Distill-Qwen-14B"
capabilities = ["text"]
context_length = 4096
# Reasoning distill: emits a <think> preamble, and prior-turn reasoning should not
# round-trip into later prompts (DeepSeek's guidance), hence post_last_user.
reasoning_dialect = "post_last_user"

# RKLLM runs on the Rockchip RK3588/RK3576 NPU. A pre-converted `.rkllm` file must be
# present on the NPU node under the models dir (directory name = this model_id); exo
# does not download it. Source weights: deepseek-ai/DeepSeek-R1-Distill-Qwen-14B;
# convert with airockchip/rknn-llm (RKLLM toolkit 1.2.x, w8a8_g128 for rk3588).
[storage_size]
in_bytes = 16820564564

[sampling_defaults]
temperature = 0.6
top_p = 0.95
top_k = 20
